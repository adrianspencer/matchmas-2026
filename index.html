m);font-weight:1000;font-style:italic;transform:rotate(-6deg);color:#181818;text-shadow:3px 3px #fff;animation:pop .5s both}.profile{display:none;width:100%;height:100%;background:#fffaf1;padding:24px 18px 10px;flex-direction:column;align-items:center;justify-content:center;gap:9px}.profile h2{margin:0;font-size:1.4rem}.profile p{margin:0;font-size:1rem;line-height:1.3;max-width:310px}.portrait{width:138px;height:138px;border-radius:16px;background:#e5a0a0;display:grid;place-items:center;overflow:hidden;border:4px solid #262626}.portrait svg{width:100%;height:100%}.day{font-weight:800;color:#bd1822}.door{position:absolute;inset:0;width:100%;height:100%;background:repeating-linear-gradient(90deg,#d81f24 0 21%,#a9101b 21% 22%,#ed2d2d 22% 25%);border:9px solid #a30c13;border-radius:165px 165px 2px 2px;transform-origin:left;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.22,.7,.15,1);z-index:4;cursor:pointer;box-shadow:inset 10px 0 #ff5959,inset -10px 0 #80070c}.door.open{transform:rotateY(-107deg)}.door:focus-visible{outline:5px solid #111}.wreath{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);width:180px;height:180px;border:32px dotted #185e2a;border-radius:50%;box-shadow:0 0 0 8px #1b8737,inset 0 0 0 8px #1b8737;background:#a41518;display:grid;place-items:center}.wreath span{font-size:4rem;color:#fff;font-weight:1000;text-shadow:4px 4px #111}.bow{position:absolute;top:57%;left:50%;transform:translateX(-50%);font-size:70px}.knob{position:absolute;right:9%;top:62%;width:25px;height:25px;background:radial-gradient(circle at 35% 35%,#fff9b5,#b57b06);border:3px solid #6e4400;border-radius:50%}.hint{font-weight:800;text-align:center;margin:6px 0}.controls{display:none;gap:12px;justify-content:center;margin-top:10px}.controls button{background:#fff;border:2px solid #ddd;border-radius:50%;font-size:22px;width:44px;height:44px;color:#d72c3e;cursor:default}footer{font-size:.85rem;font-weight:700;padding-top:10px}.history{display:flex;gap: </style></head><body><main class="wrap"><div class="corner left">🎄</div><div class="corner right">🎄</div><header><h1>Matchmas 2026</h1><p>The 24 Days of Matchmas</p></header><div class="tag">It's that time of year again… <em>Festive dating.</em></div><section class="scene"><div class="side">A new match<br>every day!</div><div><div class="stage"><div class="arch"><div class="snow"></div><div class="inside"><div id="message" class="message hidden">❤️<br>It's a Match!</div><div id="profile" class="profile"><div class="day" id="dayLabel"></div><div class="portrait" id="portrait"></div><h2 id="personName"></h2><p id="description"></p><div class="controls" aria-hidden="true"><button tabindex="-1">✕</button><button tabindex="-1">★</button><button tabindex="-1">♥</button></div></div><button class="door" id="door" aria-label="Open today's Matchmas door"><div class="wreath"><span id="doorNumber">01</span></div><div class="bow">🎀</div><div class="knob"></div></button></div></div></div><div class="side">24 days of<br>questionable<br>connections!</div></section><div class="hint" id="hint">Click the door to reveal today's match</div><button id="close" class="reset hidden">Close door</button><div id="history" class="history" aria-label="Previous days"></div><footer>© Adrian Spencer</footer></main><script>
const data=[
['The Married Singleton','Charming, attentive, and calls every evening at exactly 9:15. Never at weekends, strangely. Always seems to be staying in a hotel on business. Says they’re completely single. Their spouse may have a different interpretation.'],
['The Eternal Pen Pal','You’ve exchanged 400 messages, three playlists and a detailed history of their childhood. Suggest coffee and suddenly they’re terribly busy. At this rate, you’ll finish your correspondence just in time for retirement.'],
['The Ghost','The conversation was electric. You were laughing, making plans, even discussing Thursday. Then nothing. Not a word. Their last message was “Can’t wait!” Apparently, they meant for the afterlife.'],
['The Ex-Obsessive','They insist they’re completely over their ex. Which is why they’ve mentioned them seventeen times over dinner, compared your laugh, and accidentally called you by their name. Still, the dessert was nice.'],
['The Catfish','Their profile features a sun-kissed adventurer with perfect teeth. At the café arrives someone who looks vaguely related to the photograph, possibly its grandparent. They explain the pictures are “quite recent”. From 2008.'],
['The Interviewer','What are your five-year goals? How do you handle conflict? What’s your salary expectation? You ordered a drink, not a performance review. They’ve promised to get back to you after meeting the other candidates.'],
['The Love Bomber','By Tuesday they adore you. Wednesday brings a joint holiday itinerary. Thursday they’ve named your future dog. You haven’t even met. Friday, naturally, they need some space.'],
['The Minimalist','You send a thoughtful message. They reply “lol”. You ask about their weekend. “Fine.” You share a joke. “Haha.” Romance is alive, apparently, but operating on a very limited data plan.'],
['The Influencer','Dinner was lovely, once the lighting was right. Your starter had to be photographed six times. They referred to you as “my plus-one” in a sponsored story. At least the restaurant tagged you.'],
['The Commitment Tourist','They want something meaningful, serious and lasting. They’ve told everyone. The moment you suggest seeing each other twice in one week, however, they need to “protect their independence”. Fascinating itinerary.'],
['The Gym Evangelist','They wake at five, count every almond and describe lunch as “fuel”. Your date is a brisk walk between protein shakes. They ask whether you’ve considered optimising your mitochondria. You consider chips.'],
['The Conspiracy Theorist','They seem charming until dessert, when they explain that birds are surveillance devices and the moon is suspicious. They don’t trust dating algorithms. Which does raise the question of how you matched.'],
['The Financial Emergency','You’re the most wonderful person they’ve ever met. Their feelings are real. Unfortunately, their wallet has been stolen, their car has exploded, and a modest £500 would prove you believe in love.'],
['The Eternal Optimist','Their photos show a carefree twenty-something on a beach. In person they’re lovely, but the beach holiday was before smartphones existed. They insist they haven’t changed a bit. The camera disagrees.'],
['The Situationship Specialist','You’ve been seeing each other for months. Are you dating? Friends? Something else? They prefer not to use labels. Curiously, they have no trouble labelling every storage box in their kitchen.'],
['The Distance Problem','The app says they’re three miles away. A tiny detail: that’s where they were last summer. They actually live 200 miles away. But they’re “always in your area”, approximately twice a year.'],
['The Spiritual Guru','Your stars align beautifully, until Mercury goes retrograde and cancels brunch. Their crystals approve of you, but their aura needs boundaries. You wonder whether the universe could just pick a restaurant.'],
['The Serial Dater','They’re charming, polished and suspiciously efficient. Dinner ends at 7:55 sharp. At eight they have another “appointment” across town. They leave with a practiced smile and someone else’s scarf.'],
['The Recently Separated','They’re starting a fresh chapter. The divorce is practically done. They’re just sorting out a few things, like the house, the paperwork and the fact that their spouse still thinks they’re together.'],
['The One-Word Wonder','“Hi.” “Yeah.” “Cool.” You try humour, curiosity, even a philosophical question. “Dunno.” Their profile claims they love deep conversation. Presumably with someone else.'],
['The Perpetually Busy','They really want to meet. This week is impossible, next week’s hectic, and January looks difficult. They’ve suggested a tentative coffee in February. Next year. Weather permitting.'],
['The App Returnee','They’ve deleted every dating app and sworn off online romance forever. Yet here they are, freshly verified, explaining how they’re “just having a look”. Their profile was created eleven minutes ago.'],
['The Almost Perfect Match','Same music, same films, same ridiculous sense of humour. You finish each other’s sentences. Then they mention the one tiny condition: you must never, under any circumstances, eat cheese in their presence.'],
['The Great Escape','You’ve deleted the app. No more profiles, no more mysterious hotel calls, no more “hey” at midnight. It’s Christmas Eve. Put the phone down and spend time with the people who matter. Happy Christmas!']
];
const palettes=['#b26b39','#f0b68b','#d9a76f','#73432c','#df9c76','#583b31','#d3a07a','#e2b88f','#936342','#a96742','#603b2e','#d6a184','#805438','#cda275','#aa765c','#e1b48c','#7c4939','#e9ad82','#b56f4d','#d8aa86','#694c3b','#dba37a','#9b684e','#bd845e'];
const hairs=['#222','#4e2c27','#8d4c22','#141414','#603820','#2d2b32','#aa753c','#2b2022','#191919','#6a2626','#1e1b1b','#a56b30','#272322','#777','#401e48','#332520','#191c27','#493a2c','#3a241b','#aa643b','#1a191b','#5e422b','#261e24','#4c3424'];
const genders=['m','f','n','f','m','n','m','f','m','n','m','f','f','m','n','m','f','m','f','n','f','m','n','none'];
function avatar(i){if(i===23)return '<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="160" fill="#fbe3a3"/><path d="M25 145L80 40l55 105" fill="#196f42"/><path d="M40 115L80 25l40 90" fill="#238e50"/><path d="M54 82L80 12l26 70" fill="#39a25a"/><circle cx="80" cy="20" r="9" fill="#f3c322"/><path d="M75 120h10v35H75z" fill="#80512e"/><text x="80" y="150" font-size="18" text-anchor="middle">🎁</text></svg>';const skin=palettes[i],hair=hairs[i],g=genders[i],short=(i%4===0||i%4===2),glasses=i%5===0,beard=g==='m'&&i%3!==1;const top=['#a92236','#356a91','#3c775a','#b64b31','#7350a2','#d87d3c'][i%6];return `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="160" fill="${['#f7c9ae','#b6d5e5','#f4c4db','#bfe5c6','#e9d4a3'][i%5]}"/><path d="M8 160Q14 116 60 112H100Q145 115 152 160" fill="${top}" stroke="#252020" stroke-width="3"/><path d="M48 57Q43 12 80 14Q123 11 115 75L112 110H48Z" fill="${hair}" stroke="#242020" stroke-width="3"/><ellipse cx="80" cy="76" rx="37" ry="47" fill="${skin}" stroke="#242020" stroke-width="3"/><path d="M44 59Q47 17 82 22Q113 19 119 61Q99 47 85 40Q70 59 44 59" fill="${hair}"/><path d="M58 76h14m18 0h14" stroke="#222" stroke-width="3" stroke-linecap="round"/><circle cx="66" cy="76" r="2.7"/><circle cx="96" cy="76" r="2.7"/><path d="M81 81l-4 12h8" fill="none" stroke="#7e4536" stroke-width="2"/><path d="M66 103Q81 ${i%3===0?116:109} 97 102" fill="none" stroke="#5e2828" stroke-width="3" stroke-linecap="round"/>${beard?'<path d="M50 100Q60 136 81 134Q108 130 110 99Q97 122 81 119Q61 121 50 100" fill="'+hair+'" opacity=".9"/>':''}${glasses?'<g fill="none" stroke="#252525" stroke-width="3"><rect x="51" y="66" width="27" height="20" rx="7"/><rect x="85" y="66" width="27" height="20" rx="7"/><path d="M78 73h7"/></g>':''}<path d="M56 134L81 147l25-13" fill="none" stroke="#f8e7cf" stroke-width="4"/></svg>`}
const door=document.getElementById('door'),msg=document.getElementById('message'),profile=document.getElementById('profile'),hint=document.getElementById('hint'),close=document.getElementById('close'),history=document.getElementById('history');const now=new Date(),isDecember=now.getFullYear()===2026&&now.getMonth()===11;let available=isDecember?Math.min(now.getDate(),24):0; // Before December 2026, a Day 1 preview is available.
const preview=!isDecember; if(preview)available=1;let selected=available||1,timer;
function setDay(day){selected=day;clearTimeout(timer);door.classList.remove('open');door.disabled=false;msg.classList.add('hidden');profile.style.display='none';document.getElementById('doorNumber').textContent=String(day).padStart(2,'0');hint.textContent=preview?'Preview: click the door to reveal Day 1':'Click the door to reveal Day '+day;close.classList.add('hidden');renderHistory()}
function renderHistory(){history.innerHTML='';for(let d=1;d<=available;d++){let b=document.createElement('button');b.textContent=String(d).padStart(2,'0');b.className=d===selected?'active':'';b.setAttribute('aria-label','Show day '+d);b.addEventListener('click',()=>setDay(d));history.appendChild(b)}}
function reveal(){door.classList.add('open');door.disabled=true;msg.classList.remove('hidden');hint.textContent='It’s a Match!';timer=setTimeout(()=>{msg.classList.add('hidden');document.getElementById('dayLabel').textContent='DAY '+String(selected).padStart(2,'0')+' · IT’S A MATCH!';document.getElementById('personName').textContent=data[selected-1][0];document.getElementById('description').textContent=data[selected-1][1];document.getElementById('portrait').innerHTML=avatar(selected-1);profile.style.display='flex';hint.textContent='Tomorrow brings another match';close.classList.remove('hidden')},1300)}
door.addEventListener('click',reveal);close.addEventListener('click',()=>setDay(selected));setDay(selected);
</script></body></html>
