sponsored story. At least the restaurant tagged you."], ["The Commitment Tourist", "They want something meaningful, serious and lasting. They’ve told everyone. The moment you suggest seeing each other twice in one week, however, they need to “protect their independence”. Fascinating itinerary."], ["The Gym Evangelist", "They wake at five, count every almond and describe lunch as “fuel”. Your date is a brisk walk between protein shakes. They ask whether you’ve considered optimising your mitochondria. You consider chips."], ["The Conspiracy Theorist", "They seem charming until dessert, when they explain that birds are surveillance devices and the moon is suspicious. They don’t trust dating algorithms. Which does raise the question of how you matched."], ["The Financial Emergency", "You’re the most wonderful person they’ve ever met. Their feelings are real. Unfortunately, their wallet has been stolen, their car has exploded, and a modest £500 would prove you believe in love."], ["The Eternal Optimist", "Their photos show a carefree twenty-something on a beach. In person they’re lovely, but the beach holiday was before smartphones existed. They insist they haven’t changed a bit. The camera disagrees."], ["The Situationship Specialist", "You’ve been seeing each other for months. Are you dating? Friends? Something else? They prefer not to use labels. Curiously, they have no trouble labelling every storage box in their kitchen."], ["The Distance Problem", "The app says they’re three miles away. A tiny detail: that’s where they were last summer. They actually live 200 miles away. But they’re “always in your area”, approximately twice a year."], ["The Spiritual Guru", "Your stars align beautifully, until Mercury goes retrograde and cancels brunch. Their crystals approve of you, but their aura needs boundaries. You wonder whether the universe could just pick a restaurant."], ["The Serial Dater", "They’re charming, polished and suspiciously efficient. Dinner ends at 7:55 sharp. At eight they have another “appointment” across town. They leave with a practiced smile and someone else’s scarf."], ["The Recently Separated", "They’re starting a fresh chapter. The divorce is practically done. They’re just sorting out a few things, like the house, the paperwork and the fact that their spouse still thinks they’re together."], ["The One-Word Wonder", "“Hi.” “Yeah.” “Cool.” You try humour, curiosity, even a philosophical question. “Dunno.” Their profile claims they love deep conversation. Presumably with someone else."], ["The Perpetually Busy", "They really want to meet. This week is impossible, next week’s hectic, and January looks difficult. They’ve suggested a tentative coffee in February. Next year. Weather permitting."], ["The App Returnee", "They’ve deleted every dating app and sworn off online romance forever. Yet here they are, freshly verified, explaining how they’re “just having a look”. Their profile was created eleven minutes ago."], ["The Almost Perfect Match", "Same music, same films, same ridiculous sense of humour. You finish each other’s sentences. Then they mention the one tiny condition: you must never, under any circumstances, eat cheese in their presence."], ["The Great Escape", "You’ve deleted the app. No more profiles, no more mysterious hotel calls, no more “hey” at midnight. It’s Christmas Eve. Put the phone down and spend time with the people who matter. Happy Christmas!"]];

const $=id=>document.getElementById(id);const door=$('door'),flash=$('flash');
function showDay(n){clearTimeout(timeout);current=n;door.classList.remove('open');door.disabled=false;flash.classList.remove('show');$('close').classList.add('hide');$('doorNumber').textContent=String(n).padStart(2,'0');$('photo').src=images[n-1];$('photo').alt='Cartoon portrait for '+profiles[n-1][0];$('name').textContent=profiles[n-1][0];$('description').textContent=profiles[n-1][1];$('ribbon').textContent='Day '+n;$('count').textContent=n+' / 24';$('location').textContent=n===1?'⌖  Within hotel range':n===24?'⌖  Happily offline':'⌖  Festive dating';$('helper').textContent=inSeason?'Open Day '+n+' to reveal your match':'Preview: open Day 1';$('progress').innerHTML='';for(let i=0;i<8;i++){let d=document.createElement('i');if(Math.floor((n-1)/3)===i)d.className='on';$('progress').appendChild(d)}$('days').innerHTML='';for(let i=1;i<=available;i++){let b=document.createElement('button');b.textContent=String(i).padStart(2,'0');b.className=i===n?'active':'';b.setAttribute('aria-label','Show day '+i);b.onclick=()=>showDay(i);$('days').appendChild(b)}}
